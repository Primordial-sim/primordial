[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Primordial"
version = "0.1.0"
description = "Primordial: Motor de simulación multi-agente con genética emergente, relaciones ecológicas y evolución natural"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "Tu Nombre", email = "tu@email.com"}
]
keywords = [
    "simulacion",
    "vida-artificial",
    "ecologia",
    "genetica",
    "evolucion",
    "multi-agente",
    "ecosistema",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Games/Entertainment :: Simulation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/tu-usuario/simulador-vida"
"Bug Tracker" = "https://github.com/tu-usuario/simulador-vida/issues"
"Documentation" = "https://github.com/tu-usuario/simulador-vida/tree/main/docs"

[project.scripts]
primordial = "launcher:main"